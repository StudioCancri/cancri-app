<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Éditeur carte — Lunat</title>
<style>
  :root{--bg-0:#f7f4ef;--bg-1:#e9e2d6;--bg-2:#dbd0bf;--ink:#2b2620;--muted:#8a7d6b;--accent:#f39a1f;--line:#e5dccd;--panel:rgba(255,253,249,.85)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  #stage{position:fixed;inset:0;background:radial-gradient(55% 42% at 50% 45%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 60%),radial-gradient(140% 120% at 50% -6%,#fdfbf7 0%,var(--bg-0) 40%,var(--bg-1) 72%,var(--bg-2) 100%)}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 58%,rgba(0,0,0,0) 55%,rgba(43,38,32,.08) 100%)}
  canvas{display:block;touch-action:none;position:relative;z-index:1}
  .head{position:fixed;z-index:3;top:0;left:0;right:0;text-align:center;padding:18px 16px 6px;pointer-events:none}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--accent)}
  .h1{font-size:22px;font-weight:800;margin-top:2px}
  .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .hint{position:fixed;z-index:2;top:60%;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .5s}
  .strip{position:fixed;z-index:3;left:0;right:0;display:flex;gap:9px;justify-content:center;padding:0 14px 18px;overflow-x:auto;scrollbar-width:none;max-width:560px;margin:0 auto}
  .strip::-webkit-scrollbar{display:none}
  .thumb{flex:0 0 auto;width:60px;height:39px;border-radius:11px;background:#fff center/cover no-repeat;border:2px solid rgba(255,255,255,.85);
    box-shadow:0 4px 14px rgba(43,38,32,.16);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);transition:border-color .15s,transform .1s}
  .thumb:active{transform:scale(.94)}.thumb.sel{border-color:var(--accent)}
  .thumb .cap{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap;max-width:78px;overflow:hidden;text-overflow:ellipsis}
  .thumb.sel .cap{color:var(--accent)}
  .thumb .x{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:#fff;color:#d23;border:1px solid var(--line);display:none;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .thumb.sel .x{display:flex}
  .thumb.add{border-style:dashed;border-color:var(--line);font-size:20px;color:var(--muted)}
  .flip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.62);color:var(--ink);border-radius:13px;padding:11px 18px;cursor:pointer;transition:transform .08s}
  .flip:active{transform:scale(.97)}

  .dock{position:fixed;z-index:3;left:14px;right:14px;bottom:14px;max-width:460px;margin:0 auto;background:var(--panel);
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.7);
    border-radius:20px;padding:12px;box-shadow:0 12px 40px rgba(43,38,32,.18)}
  .vname{width:100%;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:none;outline:none;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .row{display:flex;gap:10px}
  .up{flex:1;position:relative;border:1.5px dashed var(--line);border-radius:13px;padding:10px 8px;text-align:center;background:rgba(255,255,255,.5);cursor:pointer;overflow:hidden}
  .up.filled{border-style:solid;border-color:var(--accent);background:rgba(243,154,31,.07)}
  .up input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .up .lab{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
  .up .nm{font-size:11px;color:var(--ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;font:inherit;font-size:13px;font-weight:700;border:none;border-radius:12px;padding:11px;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:11px 14px}
  .btn.gen{background:var(--accent);color:#fff}
  .badge{position:fixed;z-index:4;top:8px;left:10px;font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--ink);border-radius:8px;padding:4px 8px}
</style></head><body>
<div id="stage"></div>
<div class="badge">ÉDITEUR — visible par toi seul</div>
<div class="hint" id="hint">Glissez pour tourner · pincez pour zoomer</div>
<div class="strip" id="strip" style="top:70px"></div>
<div class="dock">
  <input class="vname" id="vname" placeholder="Nom de la version">
  <div class="row">
    <label class="up" id="upR"><div class="lab">RECTO</div><div class="nm" id="nmR">choisir</div><input type="file" accept="image/*" id="fR"></label>
    <label class="up" id="upV"><div class="lab">VERSO</div><div class="nm" id="nmV">choisir</div><input type="file" accept="image/*" id="fV"></label>
  </div>
  <div class="actions">
    <button class="btn ghost" id="flip">↻</button>
    <button class="btn gen" id="gen">Générer la page client</button>
  </div>
</div>

<script type="text/plain" id="clientTpl"><!DOCTYPE html>

    box-shadow:0 4px 14px rgba(43,38,32,.16);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);transition:border-color .15s,transform .1s}
  .thumb:active{transform:scale(.94)}.thumb.sel{border-color:var(--accent)}

  .thumb.sel .cap{color:var(--accent)}
  .thumb .x{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:#fff;color:#d23;border:1px solid var(--line);display:none;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}

<div id="stage"></div>
<div class="head"><div class="eyebrow">PROGRAMME LUNAT</div><div class="h1">Votre carte de fidélité</div><div class="sub">Choisissez la version que vous préférez</div></div>
<div class="hint" id="hint">Glissez pour tourner · pincez pour zoomer</div>
<div class="dock"><div class="strip" id="strip" style="position:static;padding-bottom:0"></div><button class="flip" id="flip">↻ Retourner</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">%%ENDSCRIPT%%
<script>
const VERSIONS=__VERSIONS__;

const stage=document.getElementById('stage');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,200);
let dist=19;camera.position.set(0,2,dist);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
scene.add(new THREE.HemisphereLight(0xffffff,0xccc0aa,0.98));
const key=new THREE.DirectionalLight(0xffffff,0.68);
key.position.set(-6,12,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1;key.shadow.camera.far=60;key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=10;key.shadow.camera.bottom=-10;
key.shadow.bias=-0.0004;scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.3);fill.position.set(8,4,6);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({opacity:0.22}));
ground.rotation.x=-Math.PI/2;ground.position.y=-3.2;ground.receiveShadow=true;scene.add(ground);
const pivot=new THREE.Group();scene.add(pivot);
const W=8.5,H=5.37,T=0.075;
const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6,metalness:0});
function tex(src){if(!src)return white.clone();const t=new THREE.TextureLoader().load(src);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;return new THREE.MeshStandardMaterial({map:t,roughness:0.55,metalness:0});}
const body=new THREE.Mesh(new THREE.BoxGeometry(W,H,T),white.clone());body.castShadow=true;pivot.add(body);
const pg=new THREE.PlaneGeometry(W,H);
const front=new THREE.Mesh(pg,white.clone());front.position.z=T/2+0.002;pivot.add(front);
const back=new THREE.Mesh(pg,white.clone());back.rotation.y=Math.PI;back.position.z=-(T/2+0.002);pivot.add(back);
function showVersion(v){front.material=tex(v&&v.recto);back.material=tex(v&&v.verso);}
let tRotX=-0.16,tRotY=0.4,rotX=-0.16,rotY=0.4;
let dragging=false,lastX=0,lastY=0,autoSpin=true;
let pointers=new Map(),pinchStart=0,distStart=0;
function down(e){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;autoSpin=false;hideHint();}
  else if(pointers.size===2){dragging=false;const p=[...pointers.values()];pinchStart=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);distStart=dist;}
  e.target.setPointerCapture(e.pointerId);}
function move(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);dist=Math.min(38,Math.max(9,distStart*(pinchStart/d)));return;}
  if(dragging){tRotY+=(e.clientX-lastX)*0.008;tRotX+=(e.clientY-lastY)*0.008;tRotX=Math.max(-1.4,Math.min(1.4,tRotX));lastX=e.clientX;lastY=e.clientY;}}
function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=0;if(pointers.size===0)dragging=false;}
const cv=renderer.domElement;
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',ev=>{ev.preventDefault();dist=Math.min(38,Math.max(9,dist+ev.deltaY*0.02));hideHint();},{passive:false});
let hintDone=false;function hideHint(){if(hintDone)return;hintDone=true;var h=document.getElementById('hint');if(h)h.style.opacity=0;}
function doFlip(){autoSpin=false;tRotY+=Math.PI;tRotX=-0.16;hideHint();}
function loop(){requestAnimationFrame(loop);if(autoSpin)tRotY+=0.0045;
  rotX+=(tRotX-rotX)*0.1;rotY+=(tRotY-rotY)*0.1;pivot.rotation.x=rotX;pivot.rotation.y=rotY;
  camera.position.z+=(dist-camera.position.z)*0.15;camera.lookAt(0,0,0);renderer.render(scene,camera);}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

let cur=0;
function select(i){cur=i;showVersion(VERSIONS[i]);
  [...document.querySelectorAll('.thumb')].forEach((t,k)=>t.classList.toggle('sel',k===i));}
const strip=document.getElementById('strip');
VERSIONS.forEach((v,i)=>{const d=document.createElement('div');d.className='thumb'+(i===0?' sel':'');
  if(v.recto)d.style.backgroundImage='url('+v.recto+')';else d.textContent=i+1;
  const c=document.createElement('div');c.className='cap';c.textContent=v.nom||('Version '+(i+1));d.appendChild(c);
  d.onclick=()=>select(i);strip.appendChild(d);});
showVersion(VERSIONS[0]);
document.getElementById('flip').onclick=doFlip;
%%ENDSCRIPT%%
</body></html></script>

const stage=document.getElementById('stage');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,200);
let dist=19;camera.position.set(0,2,dist);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
scene.add(new THREE.HemisphereLight(0xffffff,0xccc0aa,0.98));
const key=new THREE.DirectionalLight(0xffffff,0.68);
key.position.set(-6,12,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1;key.shadow.camera.far=60;key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=10;key.shadow.camera.bottom=-10;
key.shadow.bias=-0.0004;scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.3);fill.position.set(8,4,6);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({opacity:0.22}));
ground.rotation.x=-Math.PI/2;ground.position.y=-3.2;ground.receiveShadow=true;scene.add(ground);
const pivot=new THREE.Group();scene.add(pivot);
const W=8.5,H=5.37,T=0.075;
const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6,metalness:0});
function tex(src){if(!src)return white.clone();const t=new THREE.TextureLoader().load(src);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;return new THREE.MeshStandardMaterial({map:t,roughness:0.55,metalness:0});}
const body=new THREE.Mesh(new THREE.BoxGeometry(W,H,T),white.clone());body.castShadow=true;pivot.add(body);
const pg=new THREE.PlaneGeometry(W,H);
const front=new THREE.Mesh(pg,white.clone());front.position.z=T/2+0.002;pivot.add(front);
const back=new THREE.Mesh(pg,white.clone());back.rotation.y=Math.PI;back.position.z=-(T/2+0.002);pivot.add(back);
function showVersion(v){front.material=tex(v&&v.recto);back.material=tex(v&&v.verso);}
let tRotX=-0.16,tRotY=0.4,rotX=-0.16,rotY=0.4;
let dragging=false,lastX=0,lastY=0,autoSpin=true;
let pointers=new Map(),pinchStart=0,distStart=0;
function down(e){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;autoSpin=false;hideHint();}
  else if(pointers.size===2){dragging=false;const p=[...pointers.values()];pinchStart=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);distStart=dist;}
  e.target.setPointerCapture(e.pointerId);}
function move(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);dist=Math.min(38,Math.max(9,distStart*(pinchStart/d)));return;}
  if(dragging){tRotY+=(e.clientX-lastX)*0.008;tRotX+=(e.clientY-lastY)*0.008;tRotX=Math.max(-1.4,Math.min(1.4,tRotX));lastX=e.clientX;lastY=e.clientY;}}
function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=0;if(pointers.size===0)dragging=false;}
const cv=renderer.domElement;
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',ev=>{ev.preventDefault();dist=Math.min(38,Math.max(9,dist+ev.deltaY*0.02));hideHint();},{passive:false});
let hintDone=false;function hideHint(){if(hintDone)return;hintDone=true;var h=document.getElementById('hint');if(h)h.style.opacity=0;}
function doFlip(){autoSpin=false;tRotY+=Math.PI;tRotX=-0.16;hideHint();}
function loop(){requestAnimationFrame(loop);if(autoSpin)tRotY+=0.0045;
  rotX+=(tRotX-rotX)*0.1;rotY+=(tRotY-rotY)*0.1;pivot.rotation.x=rotX;pivot.rotation.y=rotY;
  camera.position.z+=(dist-camera.position.z)*0.15;camera.lookAt(0,0,0);renderer.render(scene,camera);}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

let cur=0;
function apply(){showVersion(versions[cur]);}
function refreshPanel(){const v=versions[cur];
  document.getElementById('vname').value=v.nom||'';
  setUp('upR','nmR',v.recto);setUp('upV','nmV',v.verso);}
function setUp(upId,nmId,val){const u=document.getElementById(upId),n=document.getElementById(nmId);
  if(val){u.classList.add('filled');n.textContent='image ✓';}else{u.classList.remove('filled');n.textContent='choisir';}}
function select(i){cur=i;apply();refreshPanel();renderStrip();}
function renderStrip(){const s=document.getElementById('strip');s.innerHTML='';
  versions.forEach((v,i)=>{const d=document.createElement('div');d.className='thumb'+(i===cur?' sel':'');
    if(v.recto)d.style.backgroundImage='url('+v.recto+')';else d.textContent=i+1;
    const c=document.createElement('div');c.className='cap';c.textContent=v.nom||('Version '+(i+1));d.appendChild(c);
    const x=document.createElement('div');x.className='x';x.textContent='×';x.onclick=(e)=>{e.stopPropagation();del(i);};d.appendChild(x);
    d.onclick=(e)=>{if(e.target.classList.contains('x'))return;select(i);};s.appendChild(d);});
  const add=document.createElement('div');add.className='thumb add';add.textContent='+';
  add.onclick=()=>{versions.push({nom:'Version '+(versions.length+1),recto:null,verso:null});select(versions.length-1);};s.appendChild(add);}
function del(i){if(versions.length===1)return;versions.splice(i,1);cur=Math.max(0,Math.min(cur,versions.length-1));select(cur);}
document.getElementById('vname').oninput=e=>{versions[cur].nom=e.target.value;renderStrip();};
function upload(inp,side,nmId,upId){document.getElementById(inp).onchange=e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{versions[cur][side]=ev.target.result;apply();renderStrip();setUp(upId,nmId,ev.target.result);};r.readAsDataURL(f);};}
upload('fR','recto','nmR','upR');upload('fV','verso','nmV','upV');
document.getElementById('flip').onclick=doFlip;
document.getElementById('gen').onclick=()=>{
  const tpl=document.getElementById('clientTpl').textContent;
  const data=JSON.stringify(versions);
  let out=tpl.replace('__VERSIONS__',function(){return data;});
  out=out.split('%%ENDSCRIPT%%').join('<'+'/script>');
  const blob=new Blob([out],{type:'text/html'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='carte-client.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
select(0);
</script>
