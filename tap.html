<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tampon…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2A1D14;
    --espresso-2:#40301F;
    --crema:#F0DFC6;
    --crema-soft:rgba(240,223,198,.6);
    --sage:#7C9C8C;
    --sage-deep:#5E8172;
    --danger:#C4785B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
    background:linear-gradient(165deg,var(--espresso) 0%,var(--espresso-2) 100%);
    color:var(--crema);
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .card{text-align:center;max-width:340px;width:100%;position:relative;z-index:2;}

  /* ---- état chargement ---- */
  .spinner{
    width:52px;height:52px;margin:0 auto;
    border:4px solid rgba(240,223,198,.2);
    border-top-color:var(--crema);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- disque central (succès) ---- */
  .disc{
    width:132px;height:132px;margin:0 auto 26px;
    border-radius:50%;
    background:var(--crema);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    transform:scale(0);
    box-shadow:0 20px 50px -12px rgba(0,0,0,.5);
  }
  .disc.pop{animation:discPop .6s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes discPop{0%{transform:scale(0);}70%{transform:scale(1.1);}100%{transform:scale(1);}}
  .disc .plus{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:58px;color:var(--espresso);line-height:1;
    opacity:0;
  }
  .disc.pop .plus{animation:fadeUp .4s ease .25s forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .disc.full{background:var(--crema);}
  .disc .gift{font-size:56px;opacity:0;}
  .disc.pop .gift{animation:fadeUp .4s ease .25s forwards;}

  /* halo qui pulse derrière */
  .halo{
    position:absolute;inset:-14px;border-radius:50%;
    border:2px solid var(--crema);opacity:0;
  }
  .disc.pop .halo{animation:halo .8s ease .1s;}
  @keyframes halo{0%{opacity:.5;transform:scale(.85);}100%{opacity:0;transform:scale(1.5);}}

  .brand{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--crema-soft);margin-bottom:10px;
    opacity:0;
  }
  .title{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    font-size:30px;line-height:1.15;margin-bottom:10px;
    opacity:0;
  }
  .sub{
    font-size:15px;color:var(--crema-soft);line-height:1.5;
    opacity:0;
  }
  .sub b{color:var(--crema);font-weight:600;}
  .show1{animation:fadeUp .5s ease .35s forwards;}
  .show2{animation:fadeUp .5s ease .45s forwards;}
  .show3{animation:fadeUp .5s ease .55s forwards;}

  /* compteur de tampons en points */
  .dots{
    display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
    margin-top:22px;max-width:220px;margin-left:auto;margin-right:auto;
    opacity:0;
  }
  .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--crema-soft);}
  .dot.on{background:var(--crema);border-color:var(--crema);}
  .anniv-tap{margin:22px auto 0;max-width:300px;opacity:0;border-radius:16px;padding:14px 16px;
    background:rgba(240,223,198,.12);border:1px solid rgba(240,223,198,.28);color:var(--crema);
    font-size:14px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;text-align:left;}
  .anniv-tap svg{width:26px;height:26px;flex:none;margin-top:1px;}
  .anniv-tap b{font-weight:700;}
  .anniv-tap .at-t{font-weight:700;font-size:15px;margin-bottom:2px;}
  .dot.forme{width:16px;height:16px;border:none;border-radius:0;background:none;color:var(--crema);}

  /* état plein */
  .full-msg{
    display:inline-block;margin-top:20px;padding:11px 18px;
    border:1.5px dashed var(--crema);border-radius:12px;
    font-size:14px;font-weight:600;color:var(--crema);
    opacity:0;
  }

  /* erreur douce */
  .soft{
    font-size:14px;color:var(--crema-soft);margin-top:8px;
    opacity:0;
  }

  .replay{
    margin-top:30px;opacity:0;
  }
  .wallet-link{
    display:inline-flex;align-items:center;gap:7px;
    margin-top:22px;padding:11px 18px;
    background:rgba(240,223,198,.12);
    border:1px solid rgba(240,223,198,.3);
    border-radius:12px;
    color:var(--crema);font-size:13px;font-weight:600;
    text-decoration:none;opacity:0;
  }
  .wallet-link svg{width:16px;height:16px;}
  .replay a{
    color:var(--crema-soft);font-size:13px;font-weight:600;
    text-decoration:underline;text-underline-offset:3px;
  }

  @media (prefers-reduced-motion:reduce){
    .disc,.disc .plus,.disc .gift{animation:none!important;transform:none!important;opacity:1!important;}
    .brand,.title,.sub,.dots,.full-msg,.soft,.replay{animation:none!important;opacity:1!important;}
    .spinner{animation:spin 1.2s linear infinite;}
    .halo{display:none;}
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
</div>

<script>
(function(){
  /* formes de tampons (réglage du commerce) */
  var FORMES_TAMPON = {
    coeur: { plein: ["M50 88 C46 84 10 62 10 34 C10 20 21 11 33 11 C41 11 47 15 50 21 C53 15 59 11 67 11 C79 11 90 20 90 34 C90 62 54 84 50 88 Z"], trait: [] },
    etoile: { plein: ["M50 6 L61.8 36.8 L94.7 38.5 L69 59.2 L77.6 91 L50 73 L22.4 91 L31 59.2 L5.3 38.5 L38.2 36.8 Z"], trait: [] },
    cafe: { plein: ["M12 34 H68 V56 C68 72 56 84 41 84 H39 C24 84 12 72 12 56 Z"], trait: ["M68 42 C82 42 88 48 88 55 C88 63 80 67 68 66", "M30 8 C26 14 34 18 30 24", "M48 8 C44 14 52 18 48 24"] }
  };
  function svgForme(forme, plein){
    var f = FORMES_TAMPON[forme]; if(!f) return "";
    var s = '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true" style="display:block;overflow:visible">';
    if(plein){
      f.plein.forEach(function(d){ s += '<path d="'+d+'" fill="currentColor"/>'; });
      f.trait.forEach(function(d){ s += '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>'; });
    } else {
      f.plein.concat(f.trait).forEach(function(d){ s += '<path d="'+d+'" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="5" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round"/>'; });
    }
    return s + '</svg>';
  }

  var API = "/api/carte";
  var params = new URLSearchParams(location.search);
  var SLUG = params.get("c") || "cafe-chartrons";
  /* preuve NFC ajoutée automatiquement par la puce 424 (SDM/SUN) */
  var P = params.get("p") || "";
  var M = params.get("m") || "";
  var CLE = "cancri-jeton-" + SLUG;
  var card = document.getElementById("card");

  function jeton(){ try { return localStorage.getItem(CLE); } catch(e){ return null; } }
  /* le serveur renvoie toujours le jeton : on le re-mémorise (Safari peut l'avoir effacé) */
  function garderJeton(j){ if(!j) return; try { localStorage.setItem(CLE, j); } catch(e){} }

  /* on emmène la preuve NFC avec nous quand on redirige vers l'inscription */
  function versInscription(){
    var u = "/carte.html?c=" + encodeURIComponent(SLUG) + "&tap=1";
    if(P && M) u += "&p=" + encodeURIComponent(P) + "&m=" + encodeURIComponent(M);
    location.replace(u);
  }

  function api(donnees){
    return fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify(donnees)
    }).then(function(r){ return r.json(); });
  }

  var FORME = "rond";
  function dots(n, total){
    var h = '<div class="dots" id="dots">';
    for(var i=0;i<total;i++){
      if(FORME !== "rond" && FORMES_TAMPON[FORME]) h += '<span class="dot forme">'+svgForme(FORME, i<n)+'</span>';
      else h += '<span class="dot'+(i<n?' on':'')+'"></span>';
    }
    h += '</div>';
    return h;
  }

  function walletLink(delay){
    var href = "/api/pass?jeton=" + encodeURIComponent(jeton());
    return '<div class="replay show3" style="animation-delay:'+delay+'"><a class="wallet-link" href="'+href+'">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h12A2.5 2.5 0 0 1 20.5 7v10a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 17V7Zm2.5-.5A.5.5 0 0 0 5.5 7v10a.5.5 0 0 0 .5.5h12a.5.5 0 0 0 .5-.5v-10a.5.5 0 0 0-.5-.5H6Z"/></svg>'+
      'Ajouter à Apple Wallet</a></div>';
  }
  /* anniversaire : un petit mot sous le résultat du tap */
  var ANNIV = null, ANNIV_COMMERCE = "", ANNIV_PRENOM = "";
  function noterAnniv(r){ ANNIV = r && r.anniv ? r.anniv : null; ANNIV_COMMERCE = (r && r.commerce) || ""; ANNIV_PRENOM = (r && r.prenom) || ""; }
  function echapper(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function blocAnniv(){
    if(!ANNIV) return "";
    var t = "Joyeux anniversaire" + (ANNIV_PRENOM ? " " + echapper(ANNIV_PRENOM) : "") + " !";
    var c = (ANNIV.cadeau && !ANNIV.offert)
      ? echapper(ANNIV_COMMERCE) + " t\u2019offre <b>" + echapper(ANNIV.cadeau) + "</b>. Demande-le au comptoir."
      : "Belle journ\u00e9e \u00e0 toi.";
    return '<div class="anniv-tap show3" style="animation-delay:.75s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M5 21v-7.5A1.5 1.5 0 0 1 6.5 12h11a1.5 1.5 0 0 1 1.5 1.5V21"/><path d="M5 16.2c1.2 0 1.2 1 2.3 1s1.2-1 2.3-1 1.2 1 2.4 1 1.2-1 2.3-1 1.2 1 2.4 1 1.1-1 2.3-1"/><path d="M8 12V9.5M12 12V9.5M16 12V9.5"/><path d="M8 6.8c-.6-.6-.6-1.6 0-2.3.6.7.6 1.7 0 2.3zM12 6.8c-.6-.6-.6-1.6 0-2.3.6.7.6 1.7 0 2.3zM16 6.8c-.6-.6-.6-1.6 0-2.3.6.7.6 1.7 0 2.3z" fill="currentColor"/></svg><div><div class="at-t">' + t + '</div>' + c + '</div></div>';
  }
  function vue(html){ card.innerHTML = html + blocAnniv(); document.querySelectorAll('.wallet-link').forEach(function(el){el.style.opacity='1';}); }

  /* message adapté selon le refus renvoyé par le serveur */
  function messageRefus(raison){
    if(raison === "cooldown") return "Petit instant… reviens dans quelques secondes \u2615";
    if(raison === "limite") return "Tu as déjà tamponné aujourd'hui — à bientôt !";
    if(raison === "nfc_rejeu") return "Tampon déjà compté — repose ton téléphone sur la puce à ta prochaine visite \u2615";
    if(raison === "nfc_compteur_ancien") return "Tampon déjà compté — repose ton téléphone sur la puce à ta prochaine visite \u2615";
    if(raison && raison.indexOf("nfc_") === 0) return "Lecture de la puce incomplète — repose ton téléphone bien à plat sur la carte \u2615";
    return "Reviens tout à l'heure pour ton prochain tampon \u2615";
  }

  /* ---------- caisse : points, tampons multiples, récompenses ---------- */
  function prochaineRecompense(r){
    var recs = (r.recompenses_points || []).slice().sort(function(a,b){ return a.cout - b.cout; });
    if(!recs.length) return "";
    var dispo = recs.filter(function(x){ return x.cout <= r.points; });
    if(dispo.length) return "Tu peux déjà utiliser : <b>" + dispo[dispo.length-1].nom + "</b>. Demande-la au comptoir quand tu veux.";
    var p = recs[0];
    return "Plus que <b>" + (p.cout - r.points) + " points</b> avant <b>" + p.nom + "</b>";
  }
  function reserve(r){
    var n = r.recompenses_dispo || 0;
    if(!n) return "";
    return '<div class="sub show3" style="animation-delay:.5s">🎁 ' + n + (n > 1 ? " récompenses" : " récompense") +
      " en réserve. Utilise-la au comptoir quand tu veux.</div>";
  }
  function vueCaisse(r){
    var x = r.resultat || {};
    if(x.ok === false){
      var msg = x.raison === "points_insuffisants"
        ? "Il te faut " + x.cout + " points pour " + (x.recompense || "cette récompense") + ", tu en as " + x.points + "."
        : "Tu n'as pas encore de récompense à utiliser.";
      vue('<div class="disc pop"><div class="halo"></div><span class="plus" style="font-size:40px">…</span></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">Pas encore</div>'+
        '<div class="soft show3">'+ msg +'</div>');
      return;
    }
    if(x.type === "points"){
      vue('<div class="disc pop"><div class="halo"></div><span class="plus">+'+ x.gagne +'</span></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">'+ (x.gagne > 1 ? x.gagne + " points gagnés" : x.gagne + " point gagné") +'</div>'+
        '<div class="sub show3">Tu as maintenant <b>'+ r.points +' points</b><br>'+ prochaineRecompense(r) +'</div>'+
        walletLink(".9s"));
      return;
    }
    if(x.type === "tampons"){
      vue('<div class="disc pop"><div class="halo"></div><span class="plus">+'+ x.gagne +'</span></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">'+ (x.gagne > 1 ? "Tampons ajoutés ☕" : "Tampon ajouté ☕") +'</div>'+
        (x.debloquees ? '<div class="sub show3"><b>Récompense débloquée !</b></div>' : '<div class="sub show3">Plus que <b>'+ (r.objectif - r.tampons) +'</b> avant <b>'+ r.recompense +'</b></div>')+
        dots(r.tampons, r.objectif)+ reserve(r)+
        walletLink(".9s"));
      var d = document.getElementById("dots"); if(d){ d.classList.add("show3"); d.style.animationDelay=".6s"; }
      return;
    }
    /* récompense utilisée */
    vue('<div class="disc full pop"><div class="halo"></div><div class="gift">🎁</div></div>'+
      '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
      '<div class="title show2">Bon appétit !</div>'+
      '<div class="sub show3"><b>'+ (x.recompense || "Récompense") +'</b> utilisée'+
      (r.mode === "points" ? '<br>Il te reste <b>'+ r.points +' points</b>' : "") +'</div>'+
      (r.mode === "points" ? "" : reserve(r))+
      walletLink(".9s"));
  }
  function vueSolde(r){
    if(r.mode === "points"){
      vue('<div class="disc pop"><div class="halo"></div><span class="plus" style="font-size:38px">'+ r.points +'</span></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">'+ r.points +' points</div>'+
        '<div class="sub show3">'+ prochaineRecompense(r) +'</div>'+
        '<div class="soft show3" style="animation-delay:.6s">Pour gagner des points, l\'équipe saisit ton achat, puis tu poses ton téléphone sur la carte.</div>'+
        walletLink(".9s"));
      return;
    }
    vue('<div class="disc pop"><div class="halo"></div><span class="plus" style="font-size:44px">\u2713</span></div>'+
      '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
      '<div class="title show2">'+ r.tampons +'/'+ r.objectif +'</div>'+
      '<div class="soft show3">Demande ton tampon au comptoir : l\'équipe le valide, puis tu reposes ton téléphone sur la carte \u2615</div>'+
      dots(r.tampons, r.objectif)+ reserve(r)+
      walletLink(".9s"));
    var d = document.getElementById("dots"); if(d){ d.classList.add("show3"); d.style.animationDelay=".6s"; }
  }

  /* pas de jeton sur ce téléphone ? on ne redirige plus tout de suite :
     le serveur essaie de reconnaître le client grâce à son cookie */
  var j = jeton() || "";

  /* garde-fou anti-refresh : inutile quand la puce fournit une preuve
     (le serveur détecte lui-même un rejeu, et un vrai 2e tap doit compter) */
  var GARDE = "cancri-tapfait-" + SLUG;
  var dejaFait = false;
  if(!(P && M)){
    try { dejaFait = (Date.now() - parseInt(sessionStorage.getItem(GARDE) || "0", 10)) < 90000; } catch(e){}
  }

  if(dejaFait){
    api({ action:"etat", jeton:j, commerce:SLUG }).then(function(r){
      if(r.raison === "carte_inconnue"){ versInscription(); return; }
      garderJeton(r.jeton); if(r.forme) FORME = r.forme; noterAnniv(r);
      vue(
        '<div class="disc pop"><div class="halo"></div><span class="plus" style="font-size:44px">\u2713</span></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">'+ r.tampons +'/'+ r.objectif +'</div>'+
        '<div class="soft show3">Tampon d\u00e9j\u00e0 compt\u00e9 \u2014 repose ton t\u00e9l\u00e9phone sur la puce \u00e0 ta prochaine visite \u2615</div>'+
        dots(r.tampons, r.objectif)+
        walletLink(".9s")
      );
    }).catch(function(){});
    return;
  }

  /* on tente le +1, en transmettant la preuve de la puce */
  api({ action:"tap", jeton:j, commerce:SLUG, p:P, m:M }).then(function(r){

    /* vraiment inconnu (ni jeton ni cookie) → inscription, avec la preuve NFC
       intacte : le serveur ne la consomme pas tant qu'il n'a pas trouvé la carte */
    if(r.raison === "carte_inconnue"){ versInscription(); return; }
    garderJeton(r.jeton); if(r.forme) FORME = r.forme; noterAnniv(r);

    /* la caisse avait saisi quelque chose, ou on montre juste le solde */
    if(r.caisse){ vueCaisse(r); return; }
    if(r.solde){ vueSolde(r); return; }

    /* carte pleine */
    if(r.pleine){
      vue(
        '<div class="disc full pop"><div class="halo"></div><div class="gift">🎁</div></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">Carte pleine !</div>'+
        '<div class="sub show3"><b>'+ r.recompense +'</b><br>Montre l\'écran de ta carte au comptoir</div>'+
        '<div class="replay show3" style="animation-delay:.7s"><a href="/carte.html?c='+encodeURIComponent(SLUG)+'">Voir ma carte</a></div>'
      );
      return;
    }

    /* refus (cooldown / limite / puce) → message doux, pas d'échec anxiogène */
    if(r.ok === false){
      vue(
        '<div class="disc pop"><div class="halo"></div><span class="plus" style="font-size:44px">✓</span></div>'+
        '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
        '<div class="title show2">'+ r.tampons +'/'+ r.objectif +'</div>'+
        '<div class="soft show3">'+ messageRefus(r.raison) +'</div>'+
        dots(r.tampons, r.objectif)+
        walletLink(".9s")
      );
      var d = document.getElementById("dots"); if(d){ d.classList.add("show3"); d.style.animationDelay=".6s"; }
      return;
    }

    /* SUCCÈS : +1 */
    try { sessionStorage.setItem(GARDE, String(Date.now())); } catch(e){}
    vue(
      '<div class="disc pop"><div class="halo"></div><span class="plus">+1</span></div>'+
      '<div class="brand show1">'+ (r.commerce||"") +'</div>'+
      '<div class="title show2">Tampon ajouté ☕</div>'+
      '<div class="sub show3">Plus que <b>'+ (r.objectif - r.tampons) +'</b> avant <b>'+ r.recompense +'</b></div>'+
      dots(r.tampons, r.objectif)+
      walletLink(".9s")
    );
    var d2 = document.getElementById("dots"); if(d2){ d2.classList.add("show3"); d2.style.animationDelay=".6s"; }

  }).catch(function(){
    vue(
      '<div class="disc pop"><span class="plus" style="font-size:40px">…</span></div>'+
      '<div class="title show2" style="font-size:22px">Oups</div>'+
      '<div class="soft show3">Connexion impossible. Réessaie dans un instant.</div>'
    );
  });
})();
</script>
</body>
</html>
